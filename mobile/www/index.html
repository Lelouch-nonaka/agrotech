<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Агро-Радар</title>
<meta name="theme-color" content="#0f1419">
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0f1419;
         color:#e6e6e6; font-family:'Segoe UI',sans-serif; text-align:center; padding:24px; }
  .mark { font-size:44px; }
  h1 { font-size:20px; margin:14px 0 6px; color:#4CAF50; }
  p { color:#8a949e; font-size:13px; line-height:1.5; max-width:320px; }
  code { color:#c7d0d9; background:#1a1f26; padding:2px 6px; border-radius:5px; }
</style>
</head>
<body>
  <div>
    <div class="mark">🌱</div>
    <h1>Агро-Радар</h1>
    <p>Это оболочка мобильного приложения. Она открывает сервер агронома —
       укажите его адрес в <code>capacitor.config.json</code> → <code>server.url</code>.</p>
    <p>Быстрый вариант без сборки: откройте сервер в браузере телефона и добавьте
       на главный экран — приложение работает офлайн (PWA).</p>
  </div>
</body>
</html>
